# GODKILLER ZERO — Enterprise Pre-Commit / CI Quality Gate
# Drop this file into your team's repository at: .github/workflows/godkiller-gate.yml

name: Invariant Architecture Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  anti-spaghetti-audit:
    name: Verify Zero-Vibe Invariants on Disk
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download GODKILLER ZERO Gatekeeper
        shell: pwsh
        run: |
          $Url = "https://github.com/taurus42119-stack/godkiller-zero/releases/latest/download/godkiller-zero-windows-x86_64.zip"
          Invoke-WebRequest -Uri $Url -OutFile "$env:TEMP/godkiller.zip" -UseBasicParsing
          Expand-Archive -Path "$env:TEMP/godkiller.zip" -DestinationPath "$env:TEMP/gk" -Force
          if (Test-Path "$env:TEMP/gk/godkiller-console.exe") {
            Copy-Item "$env:TEMP/gk/godkiller-console.exe" -Destination "./godkiller-console.exe" -Force
          } else {
            Copy-Item "$env:TEMP/gk/godkiller-zero.exe" -Destination "./godkiller-console.exe" -Force
          }

      - name: Run Cognitive Pre-Flight Disk Gate
        shell: pwsh
        run: |
          ./godkiller-console.exe --gate .
