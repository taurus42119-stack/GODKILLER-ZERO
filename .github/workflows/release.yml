name: Release Native Binary

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Portable Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: godkiller-console.exe
            archive_name: godkiller-zero-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build Optimized Release Binary
        env:
          CFLAGS: "-DNDEBUG"
          CXXFLAGS: "-DNDEBUG"
          RUSTFLAGS: "--remap-path-prefix ${{ github.workspace }}=/godkiller-zero"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build and Publish C# Desktop GUI (.NET 9)
        shell: pwsh
        run: |
          dotnet publish gui/GodkillerZero.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish-gui

      - name: Package Windows Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary_name }} -Destination staging/
          Copy-Item publish-gui/GodkillerZero.exe -Destination staging/
          if (Test-Path assets/app.ico) { Copy-Item assets/app.ico -Destination staging/ }
          if (Test-Path assets/app.png) { Copy-Item assets/app.png -Destination staging/ }
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.archive_name }}
          Get-FileHash -Algorithm SHA256 ${{ matrix.archive_name }} | Out-File -FilePath SHA256SUMS.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive_name }}
            SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
