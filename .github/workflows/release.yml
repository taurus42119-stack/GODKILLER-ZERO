name: Release Native Binary

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Portable Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: godkiller-zero.exe
            archive_name: godkiller-zero-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Optimized Release Binary
        env:
          CFLAGS: "-DNDEBUG"
          CXXFLAGS: "-DNDEBUG"
          RUSTFLAGS: "--remap-path-prefix ${{ github.workspace }}=/godkiller-zero"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows Binary
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.binary_name }} -DestinationPath ${{ matrix.archive_name }}
          Get-FileHash -Algorithm SHA256 ${{ matrix.archive_name }} | Out-File -FilePath SHA256SUMS.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive_name }}
            SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
