[package]
name = "godkiller-zero"
version = "1.0.0"
edition = "2021"
authors = ["taurus42119 <https://github.com/taurus42119-stack>"]
description = "Cognitive Pre-flight Firewall & Semantic IR Compiler for Google Antigravity & Coding Agents"
license = "MIT"
repository = "https://github.com/taurus42119-stack/godkiller-zero"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["tokio", "http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
eventsource-stream = "0.2"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
async-trait = "0.1"
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"

[target.'cfg(windows)'.dependencies]
tray-item = "0.10.0"
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
